server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Health-Check, den kamal-proxy pollt, bevor er Traffic umschaltet.
    location = /up {
        access_log off;
        return 200 "OK";
    }

    # Das Bildarchiv aendert sich nie mehr -> lange Client-Cache-Zeit.
    location ~ ^/(images|images_slideshow)/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Spry-UI-Assets tragen keine Content-Hashes im Namen -> kurz cachen,
    # damit eine Aenderung nach spaetestens einer Stunde durchschlaegt.
    location /Spry-UI-1.7/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # HTML und das Stylesheet nie cachen, damit ein Deploy sofort sichtbar ist.
    # $uri.html laesst auch endungslose URLs (/faq) auf ihre Seite zeigen.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }
}
